name: Check release targets
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux WebView development files
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libxdo-dev
      - run: rustup toolchain install 1.95.0 --profile minimal
      - run: cargo +1.95.0 test --workspace --locked
      - run: cargo +1.95.0 build --release --locked -p idle-control-lab
      - run: node --test
      - name: Launch the Windows WebView2 app
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/windows-smoke.ps1
      - name: Verify the browser model rebuild
        if: runner.os == 'Linux'
        shell: bash
        env:
          RUSTUP_TOOLCHAIN: 1.95.0
        run: |
          rustup target add wasm32-unknown-unknown
          ./script/build-neural.sh
          node --test test/rust-parity.test.js
  advisories:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit
